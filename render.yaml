# render.yaml
# IMPORTANT: use the exact name of your EXISTING Render service.
# Changing the name can create a different service instead of updating it.

services:
  - type: web
    name: housing-umu-web
    runtime: docker
    plan: starter

    repo: https://github.com/muliratendo/housing-umu
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Dockerfile performs the frontend and Composer builds.
    # Dockerfile CMD starts Supervisor, Nginx, and PHP-FPM.

    # Runs against the configured production database.
    # Review/back up production data before deploying schema changes.
    preDeployCommand: php artisan migrate --force

    healthCheckPath: /up

    envVars:
      - key: PORT
        value: "80"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        value: https://housing-umu.onrender.com

      - key: APP_KEY
        sync: false

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: warning

      - key: DB_CONNECTION
        value: mysql

      - key: DB_HOST
        value: housingumu-housingumu.a.aivencloud.com

      - key: DB_PORT
        value: "21079"

      - key: DB_DATABASE
        value: housing_umu

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: CACHE_STORE
        value: file

      - key: SESSION_DRIVER
        value: file

      - key: QUEUE_CONNECTION
        value: sync
