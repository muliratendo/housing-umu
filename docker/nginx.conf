user www-data;
worker_processes auto;
pid /run/nginx.pid;

# NEW: expose Nginx upstream errors in Render's runtime logs.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        # Matches PORT=80 in Render.
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            fastcgi_pass 127.0.0.1:9000;

            # FIX: Laravel/Inertia can emit response headers larger than Nginx's
            # default 4k/8k FastCGI header buffer, especially asset-preload Link
            # headers. Allow a bounded, larger response-header buffer.
            fastcgi_buffer_size 32k;

            # Keep the response body buffer settings compatible with the larger
            # header buffer.
            fastcgi_buffers 8 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Do not expose hidden files such as .env.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
